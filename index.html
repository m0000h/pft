<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Finance Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: Inter, sans-serif; min-height: 100vh; }

    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; gap: 20px;
    }
    #login-screen h1 { font-size: 26px; font-weight: 700; }
    #login-screen p  { color: #64748b; font-size: 14px; }
    .login-btn {
      background: linear-gradient(135deg,#6366f1,#06b6d4);
      color: #fff; border: none; padding: 12px 32px; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
    }
    .login-btn:hover { opacity: 0.88; }

    #app-root { display: none; padding: 24px 16px; }

    .spinner {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh; font-size: 14px; color: #475569;
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div style="font-size:44px">💰</div>
  <h1>2026 Finance Dashboard</h1>
  <p>Sign in with your GitHub account to continue</p>
  <button class="login-btn" onclick="netlifyIdentity.open('login')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57
               0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41
               -1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815
               2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925
               0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23
               .96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65
               .24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925
               .435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57
               A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    Sign in with GitHub
  </button>
</div>

<div id="app-root"></div>

<!-- Auth bootstrap — no credentials here -->
<script>
  let _token = null;

  async function apiFetch(method, table, body, id) {
    const path = id ? `/api/${table}/${id}` : `/api/${table}`;
    const res = await fetch(path, {
      method,
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${_token}`,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  window.db = {
    get:    (table)         => apiFetch("GET",    table),
    post:   (table, body)   => apiFetch("POST",   table, body),
    put:    (table, id, body) => apiFetch("PUT",  table, body, id),
    remove: (table, id)     => apiFetch("DELETE", table, null, id),
  };

  function bootApp(user) {
    _token = user.token?.access_token;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-root").style.display = "block";
    ReactDOM.render(React.createElement(App), document.getElementById("app-root"));
  }

  netlifyIdentity.on("login", user => { netlifyIdentity.close(); bootApp(user); });
  netlifyIdentity.on("init",  user => { if (user) bootApp(user); });
  netlifyIdentity.on("logout", ()  => { location.reload(); });
</script>

<script type="text/babel">
  const { useState, useEffect } = React;

  const fmt  = n  => `$${Number(n).toLocaleString()}`;
  const pct  = (a,b) => Math.min(100, Math.round((a/b)*100));

  const DEFAULT_BUDGET = [
    { category:"Housing",       budgeted:2000, spent:2000, color:"#6366f1" },
    { category:"Food & Dining", budgeted:600,  spent:520,  color:"#f59e0b" },
    { category:"Transport",     budgeted:300,  spent:340,  color:"#ef4444" },
    { category:"Utilities",     budgeted:200,  spent:185,  color:"#10b981" },
    { category:"Entertainment", budgeted:150,  spent:90,   color:"#8b5cf6" },
    { category:"Health",        budgeted:200,  spent:150,  color:"#06b6d4" },
    { category:"Savings",       budgeted:800,  spent:800,  color:"#22c55e" },
    { category:"Other",         budgeted:250,  spent:210,  color:"#f97316" },
  ];
  const DEFAULT_GOALS = [
    { name:"Emergency Fund",       target:15000, current:9200,  color:"#22c55e" },
    { name:"Vacation Fund",        target:3000,  current:1450,  color:"#6366f1" },
    { name:"New Car",              target:20000, current:5800,  color:"#f59e0b" },
    { name:"Investment Portfolio", target:50000, current:31200, color:"#06b6d4" },
  ];
  const DEFAULT_HISTORY = [
    { month:"Sep", income:5800, expenses:4200 },
    { month:"Oct", income:5800, expenses:4500 },
    { month:"Nov", income:6100, expenses:4100 },
    { month:"Dec", income:6800, expenses:5200 },
    { month:"Jan", income:5800, expenses:4295 },
    { month:"Feb", income:5800, expenses:4295 },
  ];

  function ProgressBar({ value, max, color, height=8 }) {
    return (
      <div style={{background:"#0f172a",borderRadius:99,height,overflow:"hidden"}}>
        <div style={{width:`${pct(value,max)}%`,background:color,height:"100%",borderRadius:99,transition:"width .6s ease"}}/>
      </div>
    );
  }

  function Card({ children, style={} }) {
    return <div style={{background:"#1e293b",borderRadius:16,padding:20,...style}}>{children}</div>;
  }

  function Tab({ label, active, onClick }) {
    return (
      <button onClick={onClick} style={{
        padding:"8px 18px",borderRadius:8,border:"none",cursor:"pointer",
        fontWeight:600,fontSize:13,transition:"all .2s",
        background: active?"#6366f1":"transparent",
        color: active?"#fff":"#94a3b8",
      }}>{label}</button>
    );
  }

  function App() {
    const [tab,     setTab]     = useState("overview");
    const [budget,  setBudget]  = useState([]);
    const [goals,   setGoals]   = useState([]);
    const [history, setHistory] = useState([]);
    const [loading, setLoading] = useState(true);
    const [editing, setEditing] = useState(null);
    const [editVal, setEditVal] = useState("");

    // Load data — seed defaults if first visit
    useEffect(() => {
      (async () => {
        try {
          let [b, g, h] = await Promise.all([
            window.db.get("budget"),
            window.db.get("goals"),
            window.db.get("history"),
          ]);

          if (!b.length) {
            await Promise.all(DEFAULT_BUDGET.map(r => window.db.post("budget", r)));
            b = await window.db.get("budget");
          }
          if (!g.length) {
            await Promise.all(DEFAULT_GOALS.map(r => window.db.post("goals", r)));
            g = await window.db.get("goals");
          }
          if (!h.length) {
            await Promise.all(DEFAULT_HISTORY.map(r => window.db.post("history", r)));
            h = await window.db.get("history");
          }

          setBudget(b);
          setGoals(g);
          setHistory(h);
        } catch(e) {
          console.error("Load error", e);
        } finally {
          setLoading(false);
        }
      })();
    }, []);

    const totalIncome    = 5800;
    const totalBudgeted  = budget.reduce((s,r) => s + Number(r.budgeted), 0);
    const totalSpent     = budget.reduce((s,r) => s + Number(r.spent),    0);
    const netSavings     = totalIncome - totalSpent;
    const maxBar         = Math.max(...history.map(d => d.income), 1);

    const commitEdit = async (row, field) => {
      const v = parseFloat(editVal);
      setEditing(null); setEditVal("");
      if (isNaN(v) || v < 0) return;
      const updated = { ...row, [field]: v };
      setBudget(prev => prev.map(r => r.id === row.id ? updated : r));
      try { await window.db.put("budget", row.id, { [field]: v }); }
      catch(e) { console.error(e); }
    };

    if (loading) return <div className="spinner">Loading your data…</div>;

    return (
      <div style={{maxWidth:900,margin:"0 auto"}}>

        {/* Header */}
        <div style={{marginBottom:28}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:4}}>
            <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#06b6d4)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>💰</div>
            <h1 style={{fontSize:22,fontWeight:700}}>2026 Financial Dashboard</h1>
            <button onClick={() => netlifyIdentity.logout()} style={{marginLeft:"auto",background:"transparent",border:"1px solid #334155",color:"#64748b",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:12}}>Sign out</button>
          </div>
          <p style={{color:"#64748b",fontSize:13}}>Track · Analyze · Plan — March 2026</p>
        </div>

        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
          {[
            { label:"Monthly Income", value:fmt(totalIncome),            sub:`after tax`,                           color:"#22c55e" },
            { label:"Total Spent",    value:fmt(totalSpent),             sub:`${pct(totalSpent,totalIncome)}% of income`, color: totalSpent>totalIncome?"#ef4444":"#f59e0b" },
            { label:"Net Savings",    value:fmt(netSavings),             sub:`${pct(netSavings,totalIncome)}% saved`,   color:"#6366f1" },
            { label:"Budget Left",    value:fmt(totalBudgeted-totalSpent), sub:`unspent budget`,                    color:"#06b6d4" },
          ].map(k => (
            <Card key={k.label} style={{padding:16}}>
              <div style={{fontSize:11,color:"#64748b",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>{k.label}</div>
              <div style={{fontSize:22,fontWeight:700,color:k.color}}>{k.value}</div>
              <div style={{fontSize:11,color:"#475569",marginTop:2}}>{k.sub}</div>
            </Card>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:4,background:"#1e293b",borderRadius:10,padding:4,marginBottom:20,width:"fit-content"}}>
          {["overview","budget","goals","history"].map(t => (
            <Tab key={t} label={t[0].toUpperCase()+t.slice(1)} active={tab===t} onClick={() => setTab(t)}/>
          ))}
        </div>

        {/* OVERVIEW */}
        {tab==="overview" && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            <Card>
              <div style={{fontWeight:700,marginBottom:16}}>Spending by Category</div>
              {budget.map(r => (
                <div key={r.id} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
                    <span style={{color:"#cbd5e1"}}>{r.category}</span>
                    <span style={{color:r.spent>r.budgeted?"#ef4444":"#94a3b8"}}>{fmt(r.spent)} / {fmt(r.budgeted)}</span>
                  </div>
                  <ProgressBar value={r.spent} max={r.budgeted} color={r.spent>r.budgeted?"#ef4444":r.color}/>
                </div>
              ))}
            </Card>
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <Card>
                <div style={{fontWeight:700,marginBottom:14}}>Savings Goals</div>
                {goals.map(g => (
                  <div key={g.id} style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
                      <span>{g.name}</span>
                      <span style={{color:g.color}}>{pct(g.current,g.target)}%</span>
                    </div>
                    <ProgressBar value={g.current} max={g.target} color={g.color} height={10}/>
                    <div style={{fontSize:11,color:"#475569",marginTop:3}}>{fmt(g.current)} of {fmt(g.target)}</div>
                  </div>
                ))}
              </Card>
              <Card>
                <div style={{fontWeight:700,marginBottom:10}}>💡 Quick Insights</div>
                <ul style={{paddingLeft:18,color:"#94a3b8",fontSize:13,lineHeight:1.9}}>
                  {budget.filter(r=>r.spent>r.budgeted).map(r=>(
                    <li key={r.id}>{r.category} is <span style={{color:"#ef4444"}}>{Math.round((r.spent/r.budgeted-1)*100)}% over budget</span></li>
                  ))}
                  {budget.filter(r=>r.spent<r.budgeted*0.6).map(r=>(
                    <li key={r.id}>{r.category} is <span style={{color:"#22c55e"}}>{Math.round((1-r.spent/r.budgeted)*100)}% under budget</span></li>
                  ))}
                  <li>Savings rate: <span style={{color:"#6366f1"}}>{pct(netSavings,totalIncome)}%</span> (target: 20%)</li>
                </ul>
              </Card>
            </div>
          </div>
        )}

        {/* BUDGET */}
        {tab==="budget" && (
          <Card>
            <div style={{fontWeight:700,marginBottom:16}}>Monthly Budget — click any value to edit</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
              <thead>
                <tr style={{color:"#475569",fontSize:12,textTransform:"uppercase"}}>
                  {["Category","Budgeted","Spent","Remaining","Status"].map(h=>(
                    <th key={h} style={{textAlign:"left",paddingBottom:10,fontWeight:600}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {budget.map((r) => {
                  const rem = r.budgeted - r.spent;
                  const over = rem < 0;
                  const editingBudget = editing?.id===r.id && editing?.f==="budgeted";
                  const editingSpent  = editing?.id===r.id && editing?.f==="spent";
                  return (
                    <tr key={r.id} style={{borderTop:"1px solid #0f172a"}}>
                      <td style={{padding:"10px 0",display:"flex",alignItems:"center",gap:8}}>
                        <span style={{width:10,height:10,borderRadius:3,background:r.color,display:"inline-block"}}/>
                        {r.category}
                      </td>
                      <td>
                        {editingBudget
                          ? <input autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)}
                              onBlur={()=>commitEdit(r,"budgeted")} onKeyDown={e=>e.key==="Enter"&&commitEdit(r,"budgeted")}
                              style={{width:80,background:"#0f172a",color:"#e2e8f0",border:"1px solid #6366f1",borderRadius:6,padding:"2px 6px"}}/>
                          : <span onClick={()=>{setEditing({id:r.id,f:"budgeted"});setEditVal(r.budgeted);}}
                              style={{cursor:"pointer",color:"#94a3b8",borderBottom:"1px dashed #334155"}}>{fmt(r.budgeted)}</span>
                        }
                      </td>
                      <td>
                        {editingSpent
                          ? <input autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)}
                              onBlur={()=>commitEdit(r,"spent")} onKeyDown={e=>e.key==="Enter"&&commitEdit(r,"spent")}
                              style={{width:80,background:"#0f172a",color:"#e2e8f0",border:"1px solid #6366f1",borderRadius:6,padding:"2px 6px"}}/>
                          : <span onClick={()=>{setEditing({id:r.id,f:"spent"});setEditVal(r.spent);}}
                              style={{cursor:"pointer",color:"#e2e8f0",borderBottom:"1px dashed #334155"}}>{fmt(r.spent)}</span>
                        }
                      </td>
                      <td style={{color:over?"#ef4444":"#22c55e",fontWeight:600}}>{over?"-":"+"}{fmt(Math.abs(rem))}</td>
                      <td>
                        <span style={{padding:"2px 10px",borderRadius:99,fontSize:12,fontWeight:600,
                          background:over?"#450a0a":"#052e16",color:over?"#ef4444":"#22c55e"}}>
                          {over?"Over":"On Track"}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{borderTop:"2px solid #334155",fontWeight:700}}>
                  <td style={{paddingTop:12}}>Total</td>
                  <td style={{paddingTop:12,color:"#6366f1"}}>{fmt(totalBudgeted)}</td>
                  <td style={{paddingTop:12,color:"#f59e0b"}}>{fmt(totalSpent)}</td>
                  <td style={{paddingTop:12,color:"#22c55e"}}>{fmt(totalBudgeted-totalSpent)}</td>
                  <td/>
                </tr>
              </tfoot>
            </table>
          </Card>
        )}

        {/* GOALS */}
        {tab==="goals" && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            {goals.map(g => {
              const remaining  = g.target - g.current;
              const monthsLeft = Math.ceil(remaining / 800);
              return (
                <Card key={g.id}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:15}}>{g.name}</div>
                      <div style={{color:"#475569",fontSize:12,marginTop:2}}>Target: {fmt(g.target)}</div>
                    </div>
                    <div style={{fontSize:28,fontWeight:800,color:g.color}}>{pct(g.current,g.target)}%</div>
                  </div>
                  <ProgressBar value={g.current} max={g.target} color={g.color} height={14}/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:14}}>
                    <div style={{background:"#0f172a",borderRadius:8,padding:"10px 12px"}}>
                      <div style={{fontSize:11,color:"#475569"}}>SAVED</div>
                      <div style={{fontWeight:700,color:g.color,fontSize:15}}>{fmt(g.current)}</div>
                    </div>
                    <div style={{background:"#0f172a",borderRadius:8,padding:"10px 12px"}}>
                      <div style={{fontSize:11,color:"#475569"}}>REMAINING</div>
                      <div style={{fontWeight:700,fontSize:15}}>{fmt(remaining)}</div>
                    </div>
                  </div>
                  <div style={{marginTop:10,fontSize:12,color:"#64748b"}}>
                    📅 At $800/mo: <span style={{color:"#94a3b8"}}>{monthsLeft} months to goal</span>
                  </div>
                </Card>
              );
            })}
          </div>
        )}

        {/* HISTORY */}
        {tab==="history" && (
          <Card>
            <div style={{fontWeight:700,marginBottom:20}}>Income vs. Expenses — Last 6 Months</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:16,height:200,padding:"0 8px"}}>
              {history.map(d => (
                <div key={d.id||d.month} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,height:"100%"}}>
                  <div style={{flex:1,display:"flex",alignItems:"flex-end",gap:4,width:"100%"}}>
                    <div style={{flex:1,background:"#6366f1",borderRadius:"4px 4px 0 0",height:`${(d.income/maxBar)*100}%`,transition:"height .6s ease"}}/>
                    <div style={{flex:1,background:"#f59e0b",borderRadius:"4px 4px 0 0",height:`${(d.expenses/maxBar)*100}%`,transition:"height .6s ease"}}/>
                  </div>
                  <div style={{fontSize:11,color:"#475569"}}>{d.month}</div>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:20,marginTop:16,justifyContent:"center"}}>
              {[["#6366f1","Income"],["#f59e0b","Expenses"]].map(([c,l])=>(
                <span key={l} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#94a3b8"}}>
                  <span style={{width:12,height:12,background:c,borderRadius:3,display:"inline-block"}}/>{l}
                </span>
              ))}
            </div>
            <div style={{marginTop:20,display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8}}>
              {history.map(d => (
                <div key={d.id||d.month} style={{background:"#0f172a",borderRadius:8,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontSize:12,color:"#475569",marginBottom:4}}>{d.month}</div>
                  <div style={{fontSize:12,color:"#6366f1",fontWeight:600}}>{fmt(d.income)}</div>
                  <div style={{fontSize:12,color:"#f59e0b"}}>{fmt(d.expenses)}</div>
                  <div style={{fontSize:11,color:d.income-d.expenses>0?"#22c55e":"#ef4444",marginTop:4}}>
                    +{fmt(d.income-d.expenses)}
                  </div>
                </div>
              ))}
            </div>
          </Card>
        )}

      </div>
    );
  }
</script>
</body>
</html>
