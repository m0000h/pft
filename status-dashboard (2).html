<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOH System Status</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c0f; --surface: #10141a; --border: #1e2530; --border-light: #252d3a;
    --text: #e8ecf2; --text-muted: #5a6578; --text-dim: #3a4455;
    --green: #00e87a; --green-dim: #00e87a18; --green-glow: #00e87a40;
    --red: #ff4060; --red-dim: #ff406018; --accent: #00c2ff;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.4; pointer-events: none; z-index: 0;
  }
  .page { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 48px; gap: 16px; flex-wrap: wrap; }
  .site-title { font-size: 13px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; font-family: 'DM Mono', monospace; }
  .overall-status { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1; display: flex; align-items: center; gap: 12px; }
  .overall-status.operational { color: var(--green); }
  .overall-status.outage { color: var(--red); }
  .status-dot-large { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-dot-large.up { background: var(--green); box-shadow: 0 0 12px var(--green-glow); animation: pg 2.5s ease-in-out infinite; }
  .status-dot-large.down { background: var(--red); box-shadow: 0 0 12px var(--red); }
  @keyframes pg { 0%,100%{box-shadow:0 0 8px var(--green-glow)}50%{box-shadow:0 0 20px var(--green)} }
  .header-right { text-align: right; }
  .last-updated { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: .05em; margin-bottom: 8px; }
  .refresh-btn { background: transparent; border: 1px solid var(--border-light); color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 11px; padding: 6px 14px; cursor: pointer; letter-spacing: .08em; text-transform: uppercase; transition: all .15s; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .summary-bar { display: flex; gap: 32px; margin-bottom: 40px; background: var(--surface); border: 1px solid var(--border); padding: 20px 24px; align-items: center; flex-wrap: wrap; }
  .summary-stat { display: flex; align-items: center; gap: 10px; }
  .summary-num { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .summary-num.up { color: var(--green); }
  .summary-num.down { color: var(--red); }
  .summary-num.neutral { color: var(--text-muted); }
  .summary-label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); line-height: 1.3; }
  .summary-divider { width: 1px; height: 32px; background: var(--border); }
  .group { margin-bottom: 32px; }
  .group-label { font-size: 11px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--text-dim); font-family: 'DM Mono', monospace; margin-bottom: 8px; padding-left: 2px; }
  .monitors-list { display: flex; flex-direction: column; gap: 2px; }
  .monitor-card { background: var(--surface); border: 1px solid var(--border); padding: 16px 20px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; transition: border-color .15s; }
  .monitor-card:hover { border-color: var(--border-light); }
  .monitor-card.status-up { border-left: 3px solid var(--green); }
  .monitor-card.status-down { border-left: 3px solid var(--red); }
  .monitor-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.up { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
  .status-dot.down { background: var(--red); box-shadow: 0 0 6px var(--red); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }
  .monitor-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .monitor-type { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: .08em; text-transform: uppercase; }
  .monitor-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .heartbeat-strip { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
  .hb-bar { width: 3px; border-radius: 2px; min-height: 4px; }
  .hb-bar.up { background: var(--green); opacity: .6; }
  .hb-bar.down { background: var(--red); opacity: .9; }
  .latency { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); min-width: 56px; text-align: right; }
  .status-badge { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; min-width: 52px; text-align: center; }
  .status-badge.up { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-glow); }
  .status-badge.down { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
  .loading-state { text-align: center; padding: 80px 24px; color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: .1em; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state { background: var(--red-dim); border: 1px solid var(--red); padding: 20px 24px; color: var(--red); font-family: 'DM Mono', monospace; font-size: 13px; margin-bottom: 16px; }
  .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .footer-text { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .auto-refresh { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .countdown-ring { width: 14px; height: 14px; flex-shrink: 0; }
  .countdown-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 2; }
  .ring-progress { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
</style>
</head>
<body>
<div class="page">
  <div id="app">
    <div class="loading-state"><div class="spinner"></div><div>FETCHING STATUS</div></div>
  </div>
</div>
<script>
const REFRESH_INTERVAL = 60;
let countdownTimer = null;
let countdown = REFRESH_INTERVAL;

function formatTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function formatLatency(ms) {
  if (ms == null) return '—';
  return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
}

function renderHeartbeat(beats) {
  if (!beats || !beats.length) return '';
  const recent = beats.slice(0, 40).reverse();
  const ups = recent.filter(b => b.status === 'up').map(b => b.latency_ms);
  const maxMs = ups.length ? Math.max(...ups) : 1000;
  return recent.map(b => {
    if (b.status !== 'up') return `<div class="hb-bar down" style="height:28px" title="DOWN"></div>`;
    const h = Math.max(4, Math.min(28, 4 + (b.latency_ms / maxMs) * 24));
    return `<div class="hb-bar up" style="height:${Math.round(h)}px" title="${b.latency_ms}ms"></div>`;
  }).join('');
}

function groupMonitors(monitors) {
  const g = {};
  monitors.forEach(m => { const k = m.group_name || 'Monitors'; if (!g[k]) g[k] = []; g[k].push(m); });
  return g;
}

function renderDashboard(data) {
  const s = data.summary;
  const anyDown = s.down > 0;
  const overallText = anyDown ? `${s.down} System${s.down > 1 ? 's' : ''} Down` : 'All Systems Operational';
  const groups = groupMonitors(data.monitors);
  let idx = 0;

  const groupsHTML = Object.entries(groups).map(([name, monitors]) => `
    <div class="group">
      <div class="group-label">${name}</div>
      <div class="monitors-list">
        ${monitors.map(m => `
          <div class="monitor-card status-${m.status}" style="animation:fadeIn .3s ${idx++ * 50}ms both">
            <div class="monitor-left">
              <div class="status-dot ${m.status}"></div>
              <div>
                <div class="monitor-name">${m.name}</div>
                <div class="monitor-type">${m.type}</div>
              </div>
            </div>
            <div class="monitor-right">
              <div class="heartbeat-strip">${renderHeartbeat(m.heartbeats)}</div>
              <div class="latency">${formatLatency(m.last_latency_ms)}</div>
              <div class="status-badge ${m.status}">${m.status}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  return `
    <div class="header">
      <div>
        <div class="site-title">${data.site_title || 'System Status'}</div>
        <div class="overall-status ${anyDown ? 'outage' : 'operational'}">
          <span class="status-dot-large ${anyDown ? 'down' : 'up'}"></span>${overallText}
        </div>
      </div>
      <div class="header-right">
        <div class="last-updated">CHECKED ${formatTime(data.generated_at)}</div>
        <button class="refresh-btn" onclick="loadData()">&#8635; Refresh</button>
      </div>
    </div>
    <div class="summary-bar">
      <div class="summary-stat"><div class="summary-num up">${s.up}</div><div class="summary-label">Systems<br>Online</div></div>
      <div class="summary-divider"></div>
      <div class="summary-stat"><div class="summary-num down">${s.down}</div><div class="summary-label">Systems<br>Down</div></div>
      <div class="summary-divider"></div>
      <div class="summary-stat"><div class="summary-num neutral">${s.maintenance}</div><div class="summary-label">In<br>Maintenance</div></div>
      <div class="summary-divider"></div>
      <div class="summary-stat"><div class="summary-num neutral">${data.monitors.length}</div><div class="summary-label">Total<br>Monitors</div></div>
    </div>
    ${groupsHTML}
    <div class="footer">
      <div class="footer-text">MOH UPTIME &middot; ${data.site_timezone || 'UTC'}</div>
      <div class="auto-refresh">
        <div class="countdown-ring">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <circle class="ring-bg" cx="7" cy="7" r="5"/>
            <circle class="ring-progress" id="ring" cx="7" cy="7" r="5" stroke-dasharray="31.4" stroke-dashoffset="0"/>
          </svg>
        </div>
        <span id="countdown-text">Auto-refresh in ${REFRESH_INTERVAL}s</span>
      </div>
    </div>`;
}

async function loadData() {
  clearInterval(countdownTimer);
  countdown = REFRESH_INTERVAL;
  document.getElementById('app').innerHTML = '<div class="loading-state"><div class="spinner"></div><div>FETCHING STATUS</div></div>';

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You are a data relay. Fetch the given URL using web_search and return ONLY the raw JSON body. No commentary, no markdown fences, no explanation whatsoever. Just the JSON object starting with { and ending with }.',
        messages: [{ role: 'user', content: 'Fetch and return only the JSON from: https://uptime.msgonhld.workers.dev/api/v1/public/status' }],
        tools: [{ type: 'web_search_20250305', name: 'web_search' }]
      })
    });

    if (!resp.ok) throw new Error(`API error ${resp.status}`);
    const raw = await resp.json();
    const text = raw.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('No JSON in response');
    const data = JSON.parse(match[0]);
    if (!data.monitors) throw new Error('Unexpected response format');

    document.getElementById('app').innerHTML = renderDashboard(data);
    startCountdown();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div>
          <div class="site-title">MOH Uptime</div>
          <div class="overall-status outage"><span class="status-dot-large down"></span>Status Unavailable</div>
        </div>
        <div class="header-right">
          <button class="refresh-btn" onclick="loadData()">&#8635; Retry</button>
        </div>
      </div>
      <div class="error-state">FETCH_ERROR &mdash; ${err.message}</div>`;
  }
}

function startCountdown() {
  countdown = REFRESH_INTERVAL;
  countdownTimer = setInterval(() => {
    countdown--;
    const ring = document.getElementById('ring');
    const text = document.getElementById('countdown-text');
    if (ring) ring.style.strokeDashoffset = 31.4 * (1 - countdown / REFRESH_INTERVAL);
    if (text) text.textContent = `Auto-refresh in ${countdown}s`;
    if (countdown <= 0) { clearInterval(countdownTimer); loadData(); }
  }, 1000);
}

loadData();
</script>
</body>
</html>
