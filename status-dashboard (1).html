<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOH System Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #10141a;
    --border: #1e2530;
    --border-light: #252d3a;
    --text: #e8ecf2;
    --text-muted: #5a6578;
    --text-dim: #3a4455;
    --green: #00e87a;
    --green-dim: #00e87a18;
    --green-glow: #00e87a40;
    --red: #ff4060;
    --red-dim: #ff406018;
    --yellow: #ffb020;
    --yellow-dim: #ffb02018;
    --accent: #00c2ff;
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 48px;
    gap: 16px;
  }

  .header-left {}

  .site-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-family: 'DM Mono', monospace;
  }

  .overall-status {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .overall-status.operational { color: var(--green); }
  .overall-status.degraded { color: var(--yellow); }
  .overall-status.outage { color: var(--red); }

  .status-dot-large {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    position: relative;
    top: -2px;
  }

  .status-dot-large.up {
    background: var(--green);
    box-shadow: 0 0 12px var(--green-glow), 0 0 24px var(--green-glow);
    animation: pulse-green 2.5s ease-in-out infinite;
  }

  .status-dot-large.down {
    background: var(--red);
    box-shadow: 0 0 12px var(--red);
    animation: pulse-red 1.5s ease-in-out infinite;
  }

  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 8px var(--green-glow), 0 0 20px var(--green-glow); }
    50% { box-shadow: 0 0 16px var(--green), 0 0 32px var(--green-glow); }
  }

  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 8px var(--red); }
    50% { box-shadow: 0 0 20px var(--red), 0 0 40px var(--red); }
  }

  .header-right {
    text-align: right;
  }

  .last-updated {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .refresh-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
    display: block;
    margin-left: auto;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Summary bar */
  .summary-bar {
    display: flex;
    gap: 2px;
    margin-bottom: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 24px;
    align-items: center;
    gap: 32px;
  }

  .summary-stat {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .summary-num {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .summary-num.up { color: var(--green); }
  .summary-num.down { color: var(--red); }
  .summary-num.neutral { color: var(--text-muted); }

  .summary-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1.3;
  }

  .summary-divider {
    width: 1px;
    height: 32px;
    background: var(--border);
    margin: 0 4px;
  }

  /* Group sections */
  .group {
    margin-bottom: 32px;
  }

  .group-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  /* Monitor card */
  .monitors-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .monitor-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    transition: border-color 0.15s;
    animation: fadeSlideIn 0.3s ease both;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .monitor-card:hover { border-color: var(--border-light); }
  .monitor-card.status-down { border-left: 3px solid var(--red); }
  .monitor-card.status-up { border-left: 3px solid var(--green); }

  .monitor-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.up {
    background: var(--green);
    box-shadow: 0 0 6px var(--green-glow);
  }

  .status-dot.down {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .monitor-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .monitor-type {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .monitor-right {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }

  /* Heartbeat bars */
  .heartbeat-strip {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
  }

  .hb-bar {
    width: 3px;
    border-radius: 2px;
    min-height: 4px;
    transition: opacity 0.2s;
  }

  .hb-bar.up { background: var(--green); opacity: 0.6; }
  .hb-bar.up:hover { opacity: 1; }
  .hb-bar.down { background: var(--red); opacity: 0.9; }

  /* Latency */
  .latency {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    min-width: 56px;
    text-align: right;
  }

  .latency .ms {
    font-size: 10px;
    color: var(--text-dim);
  }

  /* Status badge */
  .status-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    min-width: 52px;
    text-align: center;
  }

  .status-badge.up {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid var(--green-glow);
  }

  .status-badge.down {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid var(--red);
  }

  /* Loading & error states */
  .loading-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-state {
    background: var(--red-dim);
    border: 1px solid var(--red);
    padding: 20px 24px;
    color: var(--red);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .footer-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .auto-refresh {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .countdown-ring {
    width: 14px;
    height: 14px;
    position: relative;
    flex-shrink: 0;
  }

  .countdown-ring svg {
    transform: rotate(-90deg);
  }

  .countdown-ring circle {
    fill: none;
    stroke-width: 2;
  }

  .ring-bg { stroke: var(--border); }
  .ring-progress {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  /* Incident banner */
  .incident-banner {
    background: var(--red-dim);
    border: 1px solid var(--red);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--red);
    font-size: 14px;
    font-weight: 600;
  }

  .incident-icon { font-size: 18px; }
</style>
</head>
<body>
<div class="page">
  <div id="app">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>FETCHING STATUS</div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://corsproxy.io/?url=https://uptime.msgonhld.workers.dev/api/v1/public/status';
const REFRESH_INTERVAL = 60; // seconds

let countdown = REFRESH_INTERVAL;
let countdownTimer = null;
let refreshTimer = null;

function formatTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function formatLatency(ms) {
  if (ms === null || ms === undefined) return '—';
  return ms >= 1000 ? `${(ms/1000).toFixed(1)}s` : `${ms}`;
}

function getBarHeight(ms, maxMs) {
  const min = 4, max = 28;
  const ratio = Math.min(ms / maxMs, 1);
  return min + ratio * (max - min);
}

function renderHeartbeat(heartbeats) {
  if (!heartbeats || heartbeats.length === 0) return '';
  const recent = heartbeats.slice(0, 40).reverse();
  const latencies = recent.filter(h => h.status === 'up').map(h => h.latency_ms);
  const maxMs = latencies.length ? Math.max(...latencies) : 1000;

  return recent.map(h => {
    const h_px = h.status === 'up' ? getBarHeight(h.latency_ms, maxMs) : 28;
    const cls = h.status === 'up' ? 'up' : 'down';
    const title = `${formatTime(h.checked_at)} — ${h.status === 'up' ? h.latency_ms + 'ms' : 'DOWN'}`;
    return `<div class="hb-bar ${cls}" style="height:${h_px}px" title="${title}"></div>`;
  }).join('');
}

function groupMonitors(monitors) {
  const groups = {};
  monitors.forEach(m => {
    const g = m.group_name || 'Ungrouped';
    if (!groups[g]) groups[g] = [];
    groups[g].push(m);
  });
  return groups;
}

function renderMonitor(m, idx) {
  const hb = renderHeartbeat(m.heartbeats);
  const latency = m.last_latency_ms !== null ? m.last_latency_ms : null;
  const latencyStr = formatLatency(latency);
  const delay = (idx * 60) + 'ms';

  return `
    <div class="monitor-card status-${m.status}" style="animation-delay:${delay}">
      <div class="monitor-left">
        <div class="status-dot ${m.status}"></div>
        <div>
          <div class="monitor-name">${m.name}</div>
          <div class="monitor-type">${m.type}</div>
        </div>
      </div>
      <div class="monitor-right">
        <div class="heartbeat-strip">${hb}</div>
        <div class="latency">
          ${latencyStr !== '—' ? latencyStr : '—'}<span class="ms">${latencyStr !== '—' ? 'ms' : ''}</span>
        </div>
        <div class="status-badge ${m.status}">${m.status}</div>
      </div>
    </div>
  `;
}

function renderDashboard(data) {
  const s = data.summary;
  const isUp = data.overall_status === 'up';
  const hasDown = s.down > 0;

  const overallClass = hasDown ? 'outage' : 'operational';
  const overallText = hasDown ? `${s.down} Down` : 'All Systems Operational';
  const dotClass = hasDown ? 'down' : 'up';

  const generatedAt = formatTime(data.generated_at);
  const groups = groupMonitors(data.monitors);

  const incidentsBanner = data.active_incidents && data.active_incidents.length > 0
    ? `<div class="incident-banner"><span class="incident-icon">⚠</span> ${data.active_incidents.length} active incident${data.active_incidents.length > 1 ? 's' : ''} in progress</div>`
    : '';

  let monitorIdx = 0;
  const groupsHTML = Object.entries(groups).map(([groupName, monitors]) => `
    <div class="group">
      <div class="group-label">${groupName}</div>
      <div class="monitors-list">
        ${monitors.map(m => renderMonitor(m, monitorIdx++)).join('')}
      </div>
    </div>
  `).join('');

  return `
    <div class="header">
      <div class="header-left">
        <div class="site-title">${data.site_title || 'System Status'}</div>
        <div class="overall-status ${overallClass}">
          <span class="status-dot-large ${dotClass}"></span>${overallText}
        </div>
      </div>
      <div class="header-right">
        <div class="last-updated">CHECKED ${generatedAt}</div>
        <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      </div>
    </div>

    ${incidentsBanner}

    <div class="summary-bar">
      <div class="summary-stat">
        <div class="summary-num up">${s.up}</div>
        <div class="summary-label">Systems<br>Online</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-stat">
        <div class="summary-num down">${s.down}</div>
        <div class="summary-label">Systems<br>Down</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-stat">
        <div class="summary-num neutral">${s.maintenance}</div>
        <div class="summary-label">In<br>Maintenance</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-stat">
        <div class="summary-num neutral">${data.monitors.length}</div>
        <div class="summary-label">Total<br>Monitors</div>
      </div>
    </div>

    ${groupsHTML}

    <div class="footer">
      <div class="footer-text">MOH UPTIME · ${data.site_timezone || 'UTC'}</div>
      <div class="auto-refresh">
        <div class="countdown-ring">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <circle class="ring-bg" cx="7" cy="7" r="5"/>
            <circle class="ring-progress" id="ring" cx="7" cy="7" r="5" stroke-dasharray="31.4" stroke-dashoffset="0"/>
          </svg>
        </div>
        <span id="countdown-text">Auto-refresh in ${REFRESH_INTERVAL}s</span>
      </div>
    </div>
  `;
}

async function loadData() {
  clearInterval(countdownTimer);
  clearTimeout(refreshTimer);
  countdown = REFRESH_INTERVAL;

  try {
    const resp = await fetch(API_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    document.getElementById('app').innerHTML = renderDashboard(data);
    startCountdown();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div class="header-left">
          <div class="site-title">MOH Uptime</div>
          <div class="overall-status outage">⚠ Status Unavailable</div>
        </div>
        <div class="header-right">
          <button class="refresh-btn" onclick="loadData()">↻ Retry</button>
        </div>
      </div>
      <div class="error-state">FETCH_ERROR — ${err.message}</div>
    `;
  }
}

function startCountdown() {
  countdown = REFRESH_INTERVAL;
  const circumference = 31.4;

  countdownTimer = setInterval(() => {
    countdown--;
    const ring = document.getElementById('ring');
    const text = document.getElementById('countdown-text');
    if (ring) {
      const offset = circumference * (1 - countdown / REFRESH_INTERVAL);
      ring.style.strokeDashoffset = offset;
    }
    if (text) text.textContent = `Auto-refresh in ${countdown}s`;
    if (countdown <= 0) {
      clearInterval(countdownTimer);
      loadData();
    }
  }, 1000);
}

loadData();
</script>
</body>
</html>
